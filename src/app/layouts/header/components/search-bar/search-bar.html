<div
  class="flex border-gray-500 border-solid border items-center gap-2 bg-[#2a2a2a] rounded-full px-4 py-2 w-full h-[40px]"
>
  <fa-icon [icon]="faSearch" class="text-[#8c8c8c]"></fa-icon>
  <input
    type="text"
    class="bg-transparent outline-none text-white flex-1 placeholder-[#666]"
    [placeholder]="placeholder"
    [value]="searchItem"
    (input)="onInputChange($event.target.value)"
  />
</div>
